services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: apz_docs
      POSTGRES_USER: apz
      POSTGRES_PASSWORD: apz_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./apps/api/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apz -d apz_docs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://apz:apz_dev_password@db:5432/apz_docs
      JWT_SECRET: change-this-in-production
      ADMIN_EMAIL: admin@apz.local
      ADMIN_PASSWORD: change-me-now
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docs:/app/docs
      - ./docs_pending:/app/docs_pending

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
